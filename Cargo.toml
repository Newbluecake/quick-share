[workspace]
members = [
    "crates/quick-share-cli",
    "crates/quick-share-core",
    "crates/quick-share-protocol",
    "crates/quick-share-discovery",
    "crates/quick-share-transfer",
    "crates/quick-share-update",
    "crates/quick-share-web",
    "crates/quick-share-platform",
]
default-members = ["crates/quick-share-cli"]
resolver = "3"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Newbluecake/quick-share"
authors = ["Quick Share Contributors"]
publish = false

[workspace.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "multipart"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
blake3 = "1.8"
bytes = "1.12"
cap-std = "4.0.2"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
ed25519-dalek = "2.2"
encoding_rs = "0.8"
embed-resource = "3.0.11"
flume = "0.12"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
if-addrs = "0.15"
mdns-sd = "0.20"
mime_guess = "2.0"
percent-encoding = "2.3"
proptest = "1.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
qrcode = { version = "0.14", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
self-replace = "1.5"
sha2 = "0.10"
snow = "=0.10.0"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["limit", "util"] }
tray-icon-win = { version = "0.1.5", default-features = false, features = ["common-controls-v6"] }
toml = "0.9"
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["serde", "v7"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
x25519-dalek = { version = "2.0", features = ["getrandom", "static_secrets"] }
zeroize = "1.8"
zip = { version = "8.6", default-features = false }
quick-share-core = { path = "crates/quick-share-core" }
quick-share-discovery = { path = "crates/quick-share-discovery" }
quick-share-platform = { path = "crates/quick-share-platform" }
quick-share-protocol = { path = "crates/quick-share-protocol" }
quick-share-transfer = { path = "crates/quick-share-transfer" }
quick-share-update = { path = "crates/quick-share-update" }
quick-share-web = { path = "crates/quick-share-web" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
