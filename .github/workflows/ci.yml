name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-27
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format
        run: |
          cargo fmt --all -- --check
          (cd fuzz && cargo fmt -- --check)
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Verify pinned release public key copies
        run: scripts/release/check-signing-key.sh
      - name: Audit dependency licenses and sources
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          command-arguments: licenses sources

  rust-platform-check:
    name: Rust test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-27
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace --all-targets --all-features --locked

  rust-fuzz-smoke:
    name: Rust Noise framing fuzz smoke
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-01
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-27
        with:
          toolchain: nightly-2026-07-01
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Check pinned fuzz dependency graph
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Build fuzz target
        run: cargo fuzz build noise_records
      - name: Run bounded framing/control fuzz smoke
        run: cargo fuzz run noise_records -- -max_total_time=10 -timeout=5

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-27
        with:
          toolchain: 1.92.0
      - name: Install MSRV-compatible cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit

  installer-contracts:
    name: Installer contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test Shell installer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats
          bash -n install.sh
          bats tests/install/test_install_sh.bats
      - name: Install Pester
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Invoke-Pester -Path tests/install/test_install_ps1.Tests.ps1 -CI
