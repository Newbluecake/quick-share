name: Release Rust binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-27
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: scripts/release/check-signing-key.sh
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          command-arguments: licenses sources
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and smoke ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: quick-share
            asset: quick-share-x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: quick-share
            asset: quick-share-x86_64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: quick-share
            asset: quick-share-x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            binary: quick-share
            asset: quick-share-aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: quick-share.exe
            asset: quick-share-x86_64-pc-windows-msvc.exe
            archive: zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-27
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl linker
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build locked release binary
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Stage raw single-file asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "release-assets/${{ matrix.asset }}"
      - name: Verify tag and Cargo binary versions agree
        shell: bash
        run: |
          expected="quick-share ${GITHUB_REF_NAME#v}"
          actual="$("$PWD/release-assets/${{ matrix.asset }}" --version)"
          test "$actual" = "$expected"
      - name: Smoke released Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/release/smoke-unix.sh "$PWD/release-assets/${{ matrix.asset }}"
      - name: Smoke released Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/smoke-windows.ps1 -Binary "$PWD/release-assets/${{ matrix.asset }}"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-assets/${{ matrix.asset }}
          format: spdx-json
          output-file: release-assets/${{ matrix.asset }}.spdx.json
          upload-artifact: false
      - name: Create Unix release archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C release-assets -czf \
            "release-assets/quick-share-${version}-${{ matrix.target }}.tar.gz" \
            "${{ matrix.asset }}"
      - name: Create Windows release archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -LiteralPath "release-assets/${{ matrix.asset }}" `
            -DestinationPath "release-assets/quick-share-$version-${{ matrix.target }}.zip"
      - name: Attest raw executable provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/${{ matrix.asset }}
      - name: Upload staged release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: release-assets/*

  publish:
    name: Checksums, attestation, and GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate deterministic SHA-256 manifest
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          test -s SHA256SUMS
      - name: Sign checksum manifest with pinned Ed25519 release key
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
        run: |
          test -n "$RELEASE_SIGNING_KEY_PEM"
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY_PEM" > "$key_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" \
            -in release-assets/SHA256SUMS \
            -out release-assets/SHA256SUMS.sig
          test "$(stat -c %s release-assets/SHA256SUMS.sig)" -eq 64
      - name: Attest checksum manifest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
